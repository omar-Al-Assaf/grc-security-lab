name: Team Gate Acceptance
on:
  pull_request:
    branches: ['research/team-gate-20261016-bb684132/**']
permissions:
  contents: read
jobs:
  security:
    name: Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 resolved by parent
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 resolved by parent
        with:
          python-version: '3.12'
      - name: Run bandit
        id: scan
        continue-on-error: true
        run: pip install bandit==1.9.4 && bandit -r sync -ll -f json -o "$RUNNER_TEMP/team-bandit.json"
      - name: Observe without changing scanner outcome
        if: ${{ always() }}
        env:
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
          SCAN_CONCLUSION: ${{ steps.scan.conclusion }}
        run: |
          echo "TEAM_SCAN_OUTCOME=$SCAN_OUTCOME"
          echo "TEAM_SCAN_CONCLUSION=$SCAN_CONCLUSION"
          python --version
          bandit --version
          if git rev-parse HEAD > /dev/null 2>&1; then
            echo "TEAM_ANALYZED_SHA=$(git rev-parse HEAD)"
          fi
          if test -f "$RUNNER_TEMP/team-bandit.json"; then
            echo TEAM_REPORT_START
            cat "$RUNNER_TEMP/team-bandit.json"
            echo
            echo TEAM_REPORT_END
          else
            echo TEAM_REPORT_MISSING
          fi
